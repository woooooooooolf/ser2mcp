[package]
name = "ser2mcp"
version = "0.1.0"
edition = "2024"
description = "UART 串口 MCP 服务器：将本地串口设备封装为标准 MCP 工具，供 AI 助手直接读写"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/ser2mcp"

[dependencies]
rmcp = { version = "3.1.0", features = ["server", "macros", "transport-io", "schemars"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "io-std", "signal", "time", "sync"] }
serialport = "4.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1.0"

[dev-dependencies]
rmcp = { version = "3.1.0", features = ["client", "transport-child-process"] }

[profile.release]
lto = true
strip = true
