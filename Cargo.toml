[package]
name = "ser2mcp"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "UART serial port MCP server: expose local serial ports to AI assistants as standard MCP tools"
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://github.com/woooooooooolf/ser2mcp"
documentation = "https://docs.rs/ser2mcp"
keywords = ["mcp", "serial", "uart", "model-context-protocol", "ai"]
categories = ["hardware-support", "development-tools"]
repository = "https://github.com/woooooooooolf/ser2mcp"
exclude = [".github"]

[dependencies]
rmcp = { version = "3.1.0", features = ["server", "macros", "transport-io", "schemars"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "io-std", "signal", "time", "sync"] }
serialport = "4.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1.0"

[dev-dependencies]
rmcp = { version = "3.1.0", features = ["client", "transport-child-process"] }

[profile.release]
lto = true
strip = true
