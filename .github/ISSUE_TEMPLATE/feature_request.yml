name: 功能请求
description: 描述使用中想要的功能或改进
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: 如果你在使用中想要某个功能，可以在这里描述。是否采纳取决于实际需要。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你遇到了什么场景或痛点？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望 ser2mcp 如何实现？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 你考虑过哪些替代方案？
