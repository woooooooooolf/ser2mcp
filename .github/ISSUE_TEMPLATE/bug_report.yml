name: Bug 报告
description: 描述使用中遇到的问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 如果使用中遇到了问题，可以在这里描述。请尽量填写完整信息。
  - type: input
    id: version
    attributes:
      label: ser2mcp 版本
      description: 二进制版本号或 git commit
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统
      description: 操作系统及版本
      placeholder: Windows 11 / macOS 15 / Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: MCP 客户端
      options:
        - Claude Desktop
        - Cursor
        - 其他（请在补充信息中说明）
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 如何复现这个问题？
      placeholder: |
        1. 调用 uart_open 打开 COM3
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 设置 RUST_LOG=debug 后复现，粘贴 stderr 日志
      render: shell
